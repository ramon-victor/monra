name: monra

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in versions.env}
    environment:
      POSTGRES_USER: monra_admin
      POSTGRES_PASSWORD: ${MONRA_POSTGRES_ADMIN_PASSWORD:?Set MONRA_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      MONRA_STUDIO_DB_PASSWORD: ${MONRA_STUDIO_DB_PASSWORD:?Set MONRA_STUDIO_DB_PASSWORD}
      MONRA_WA_DB_PASSWORD: ${MONRA_WA_DB_PASSWORD:?Set MONRA_WA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-monra-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  valkey:
    image: ${VALKEY_IMAGE:?Set VALKEY_IMAGE in versions.env}
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --appendfsync everysec --requirepass "$$VALKEY_PASSWORD"
    environment:
      VALKEY_PASSWORD: ${MONRA_VALKEY_PASSWORD:?Set MONRA_VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  wa:
    image: ${MONRA_WA_IMAGE:?Set MONRA_WA_IMAGE in versions.env}
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: monra-wa-service
      GLOBAL_API_KEY: ${MONRA_WA_API_KEY:?Set MONRA_WA_API_KEY}
      POSTGRES_AUTH_DB: postgresql://monra_wa:${MONRA_WA_DB_PASSWORD}@postgres:5432/monra_wa_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://monra_wa:${MONRA_WA_DB_PASSWORD}@postgres:5432/monra_wa_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: ${MONRA_SAVE_MESSAGES:-false}
      REDIS_URL: redis://:${MONRA_VALKEY_PASSWORD}@valkey:6379/0
      WEBHOOK_URL: ""
      WEBHOOK_SECRET: ${MONRA_WEBHOOK_SECRET:?Set MONRA_WEBHOOK_SECRET}
      WEBHOOK_FILES: ${MONRA_WEBHOOK_FILES:-true}
      CONNECT_ON_STARTUP: ${MONRA_CONNECT_ON_STARTUP:-true}
      DEBUG_ENABLED: ${MONRA_WA_LOG_LEVEL:-INFO}
      LOG_TYPE: console
      LOG_DIRECTORY: /app/logs
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"
      OS_NAME: Monra WA Service
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_GROUP: ${MONRA_IGNORE_GROUP_EVENTS:-false}
      EVENT_IGNORE_STATUS: ${MONRA_IGNORE_STATUS_EVENTS:-true}
      QRCODE_MAX_COUNT: "5"
      CHECK_USER_EXISTS: "true"
    volumes:
      - wa_logs:/app/logs
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:4000/server/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - services

  studio-migrate:
    image: ${MONRA_STUDIO_IMAGE:?Set MONRA_STUDIO_IMAGE in versions.env}
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://monra_studio:${MONRA_STUDIO_DB_PASSWORD}@postgres:5432/monra_studio?sslmode=disable
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  studio:
    image: ${MONRA_STUDIO_IMAGE:?Set MONRA_STUDIO_IMAGE in versions.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://monra_studio:${MONRA_STUDIO_DB_PASSWORD}@postgres:5432/monra_studio?sslmode=disable
      BETTER_AUTH_SECRET: ${MONRA_AUTH_SECRET:?Set MONRA_AUTH_SECRET}
      BETTER_AUTH_URL: ${MONRA_PUBLIC_URL:?Set MONRA_PUBLIC_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${MONRA_TRUSTED_ORIGINS:?Set MONRA_TRUSTED_ORIGINS}
      WHATSAPP_API_URL: http://wa:4000
      WHATSAPP_API_KEY: ${MONRA_WA_API_KEY:?Set MONRA_WA_API_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${MONRA_WEBHOOK_SECRET:?Set MONRA_WEBHOOK_SECRET}
      WHATSAPP_WEBHOOK_BASE_URL: http://studio:5522
      WHATSAPP_WEBHOOK_REQUIRE_SIGNATURE: "true"
      WHATSAPP_WEBHOOK_LOG_FULL_PAYLOAD: "false"
      LOGGER_DEBUG: ${MONRA_STUDIO_DEBUG:-false}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CHAT_AGENT_MODEL: ${CHAT_AGENT_MODEL:-gemini-cli/gemini-3-flash-preview}
      CHAT_AGENT_MODEL_MAX_RETRIES: ${CHAT_AGENT_MODEL_MAX_RETRIES:-3}
    ports:
      - "${MONRA_BIND_IP:-127.0.0.1}:${MONRA_PORT:-5522}:5522"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:5522/api/health/ready');if(!r.ok)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      wa:
        condition: service_healthy
      studio-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - services

  caddy:
    profiles: [public]
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE in versions.env}
    environment:
      MONRA_DOMAIN: ${MONRA_DOMAIN:-}
      MONRA_ACME_EMAIL: ${MONRA_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      studio:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - services

networks:
  backend:
    internal: true
  services:

volumes:
  postgres_data:
    name: monra_postgres_data
  valkey_data:
    name: monra_valkey_data
  wa_logs:
    name: monra_wa_logs
  caddy_data:
    name: monra_caddy_data
  caddy_config:
    name: monra_caddy_config
